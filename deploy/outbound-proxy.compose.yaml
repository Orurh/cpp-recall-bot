# Optional generic outbound proxy; configure addresses only in a local .env.
services:
  bot:
    environment:
      HTTPS_PROXY: ${OUTBOUND_HTTPS_PROXY:?Set the outbound proxy URL locally}
      HTTP_PROXY: ${OUTBOUND_HTTPS_PROXY:?Set the outbound proxy URL locally}
      NO_PROXY: localhost,127.0.0.1,::1,postgres
    networks:
      - default
      - outbound

networks:
  outbound:
    external: true
    name: ${OUTBOUND_PROXY_NETWORK:?Set the existing proxy network locally}
