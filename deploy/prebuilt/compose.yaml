# Отдельный проект, НЕ дополнение к корневому compose.yaml.
name: cpp-recall-germany

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpp_recall_bot}
      POSTGRES_USER: ${POSTGRES_USER:-cpp_recall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a new database password}
    # База доступна только в сети Compose, без публикации порта хоста.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    # По умолчанию up запускает только БД. Явный up bot тоже включает профиль!
    profiles: [release]
    image: ${CPP_RECALL_IMAGE:?Set the reviewed image reference with sha256 digest}
    platform: linux/amd64
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set the bot token only on the server}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cpp_recall}:${POSTGRES_PASSWORD:?Set a new database password}@postgres:5432/${POSTGRES_DB:-cpp_recall_bot}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-2}
      MINI_APP_URL: ${MINI_APP_URL:?Set the final public HTTPS address}
      MINI_APP_LISTEN_ADDRESS: 0.0.0.0
      MINI_APP_PORT: 8080
      MINI_APP_STATIC_DIR: docs/miniapp
      MINI_APP_AUTH_MAX_AGE_SECONDS: ${MINI_APP_AUTH_MAX_AGE_SECONDS:-86400}
      MINI_APP_WORKER_COUNT: ${MINI_APP_WORKER_COUNT:-2}
      MINI_APP_FEEDBACK_ADMIN_ID: ${MINI_APP_FEEDBACK_ADMIN_ID:-}
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
    # Создать отдельно при согласованной миграции, затем восстановить копию.
    # Отсутствие тома должно остановить запуск, а не незаметно создать пустую БД.
    external: true
    name: cpp_recall_germany_postgres_data
