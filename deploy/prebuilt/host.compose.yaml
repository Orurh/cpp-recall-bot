# Use with compose.yaml on the VM whose reverse proxy is on another host.
services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set the reviewed PostgreSQL image digest}
    pull_policy: never
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  bot:
    pull_policy: never
    environment:
      MINI_APP_BOT_USERNAME: ${MINI_APP_BOT_USERNAME:-cpp_recall_bot}
      MINI_APP_MAINTENANCE_STATUS_FILE: /app/monitoring/status.json
    # Compose retains the base loopback port for local health checks.
    ports:
      - "${MINI_APP_PRIVATE_ADDRESS:?Set the private VM address}:8081:8080"
    volumes:
      - /var/lib/cpp-recall-monitoring/public:/app/monitoring:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
