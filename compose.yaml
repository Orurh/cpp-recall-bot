services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpp_recall_bot}
      POSTGRES_USER: ${POSTGRES_USER:-cpp_recall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}

    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cpp_recall} -d ${POSTGRES_DB:-cpp_recall_bot}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

  bot:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-unknown}
    restart: unless-stopped
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?Set TELEGRAM_BOT_TOKEN in .env or the environment}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cpp_recall}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-cpp_recall_bot}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      MINI_APP_URL: ${MINI_APP_URL:-}
      MINI_APP_LISTEN_ADDRESS: 0.0.0.0
      MINI_APP_PORT: 8080
      MINI_APP_STATIC_DIR: docs/miniapp
      MINI_APP_AUTH_MAX_AGE_SECONDS: ${MINI_APP_AUTH_MAX_AGE_SECONDS:-86400}
      MINI_APP_WORKER_COUNT: ${MINI_APP_WORKER_COUNT:-4}
      MINI_APP_FEEDBACK_ADMIN_ID: ${MINI_APP_FEEDBACK_ADMIN_ID:-}
    ports:
      - "127.0.0.1:${MINI_APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
