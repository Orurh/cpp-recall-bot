services:
  postgres:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cpp_recall_bot}
      POSTGRES_USER: ${POSTGRES_USER:-cpp_recall}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-cpp_recall} -d ${POSTGRES_DB:-cpp_recall_bot}"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
