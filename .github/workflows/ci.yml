name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reject local dumps and secret files
        run: python3 scripts/check_release_files.py
      - name: Install formatter
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-20
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run preflight
        run: make preflight

  build-and-test:
    needs: preflight
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cpp_recall_bot_test
          POSTGRES_USER: cpp_recall
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cpp_recall -d cpp_recall_bot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://cpp_recall:test-password@localhost:5432/cpp_recall_bot_test

    steps:
      - uses: actions/checkout@v4

      - name: Reject local dumps and secret files
        run: python3 scripts/check_release_files.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-format-20 \
            cppcheck \
            libboost-json1.83-dev \
            libboost-system1.83-dev \
            libcurl4-openssl-dev \
            libgtest-dev \
            libpq-dev \
            postgresql-client \
            libspdlog-dev

      - name: Configure
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DBUILD_TESTING=ON -DCMAKE_REQUIRE_FIND_PACKAGE_GTest=ON

      - name: Build
        run: cmake --build build -j2

      - name: Validate content
        run: |
          ./build/content_check content/questions
          python3 scripts/audit_content_quality.py --check
          python3 scripts/validate_content_reviews.py

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Static analysis
        run: cmake --build build --target cppcheck

  browser-smoke:
    name: Browser UI smoke (C++ curriculum and coding)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Review question wording and pre-answer hints
        run: |
          python3 -m unittest discover -s tests -p 'test_answer_quality_audit.py'
          python3 scripts/audit_answer_quality.py --format markdown --output "${{ runner.temp }}/answer-quality.md"
          python3 scripts/audit_answer_quality.py --format json --output "${{ runner.temp }}/answer-quality.json"

      - name: Preserve educational quality report
        uses: actions/upload-artifact@v4
        with:
          name: cpp-recall-answer-quality-audit
          path: |
            ${{ runner.temp }}/answer-quality.md
            ${{ runner.temp }}/answer-quality.json
          retention-days: 14

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check Chromium availability
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          test -n "$browser" || { echo "Chromium-compatible browser is unavailable"; exit 1; }
          echo "CHROMIUM=$browser" >> "$GITHUB_ENV"
          "$browser" --version

      - name: Run browser UI smoke
        env:
          CPP_RECALL_UI_ARTIFACTS: ${{ runner.temp }}/cpp-recall-ui
        run: node tests/browser_coding_smoke.mjs

      - name: Preserve mobile UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cpp-recall-mobile-ui-screenshots
          path: |
            ${{ runner.temp }}/cpp-recall-ui/*.png
            ${{ runner.temp }}/cpp-recall-ui/*.json
          if-no-files-found: warn
          retention-days: 7

  publish-image:
    needs: [preflight, build-and-test, browser-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Orurh/cpp-recall-bot'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    concurrency:
      group: publish-cpp-recall-image
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Reject local dumps and secret files
        run: python3 scripts/check_release_files.py

      - name: Build and publish the tested commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cpp-recall"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --platform linux/amd64 \
            --build-arg "APP_VERSION=$GITHUB_SHA" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "$image:$GITHUB_SHA" .
          published=0
          for attempt in 1 2 3; do
            if docker push "$image:$GITHUB_SHA"; then
              published=1
              break
            fi
            echo "::warning::GHCR push attempt $attempt failed; retrying if attempts remain"
            if [ "$attempt" -lt 3 ]; then sleep "$((attempt * 5))"; fi
          done
          test "$published" -eq 1

      - name: Logout
        if: always()
        run: docker logout ghcr.io
